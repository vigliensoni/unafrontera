baseURL = "/"
title = "Una Frontera Líquida"
languageCode = "en"
relativeURLs = true          # links work from any sub-path or straight from disk
disableKinds = ["taxonomy", "term", "RSS"]

# Pretty root URLs for the locality pages: /petorca/, /el-manzano/, ...
[permalinks.page]
  localities = "/:contentbasename/"

[params]
  tagline = "A Liquid Frontier"
  description = "Una Frontera Líquida – A Liquid Frontier."
  footer = "© Una Frontera Líquida"

